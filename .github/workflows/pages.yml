name: Deploy site to GitHub Pages

# The site is already built -- R/run_all.R runs locally and its output is
# committed under site/. So this workflow does not build anything; it just
# uploads site/ as the Pages artifact. Nothing here needs R, and nothing here
# ever sees the EBD or a personal export.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Publishing is one-way: once a broken payload is live it is live until the
  # next push, and Pages caches assets for ten minutes on top of that. So the
  # checks that validate exactly what is about to be uploaded run first. These
  # need no dependencies and take a few seconds.
  verify:
    name: verify payloads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node --test "tests/**/*.test.js"

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
